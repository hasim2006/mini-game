<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="logo-badge" x1="0" y1="0" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="160" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <filter id="logo-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Icon Badge -->
  <rect x="6" y="8" width="44" height="44" rx="12" fill="url(#logo-badge)" filter="url(#logo-shadow)"/>
  <path d="M28 20V40M18 30H38" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="36" cy="22" r="3" fill="#34D399"/>
  <circle cx="20" cy="38" r="3" fill="#FBBF24"/>
  
  <!-- Text -->
  <text x="62" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="url(#text-grad)" letter-spacing="0.5">MINI GAME</text>
  <text x="62" y="47" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#4F46E5" letter-spacing="3.5">ARCADE</text>
</svg>
