<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="fb-bg" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#120E2C"/>
      <stop offset="1" stop-color="#240046"/>
    </linearGradient>
    <linearGradient id="slash-grad" x1="40" y1="200" x2="360" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5D4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#00F5D4"/>
    </linearGradient>
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" rx="16" fill="url(#fb-bg)"/>
  
  <!-- Subtle circular grid / rays -->
  <circle cx="200" cy="120" r="90" stroke="#7928CA" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3"/>
  <circle cx="200" cy="120" r="140" stroke="#7928CA" stroke-width="1" stroke-dasharray="4 8" opacity="0.2"/>

  <!-- Sliced Watermelon (Left Half) -->
  <g transform="translate(145, 95) rotate(-22)">
    <path d="M0 0 A 55 55 0 0 0 -55 -40 L 0 0 Z" fill="#2E7D32"/>
    <path d="M-4 -3 A 48 48 0 0 0 -50 -36 L -4 -3 Z" fill="#FFFFFF"/>
    <path d="M-6 -6 A 44 44 0 0 0 -46 -32 L -6 -6 Z" fill="#FF1744"/>
    <!-- Seeds -->
    <ellipse cx="-20" cy="-14" rx="2" ry="3.5" fill="#212121" transform="rotate(30 -20 -14)"/>
    <ellipse cx="-32" cy="-22" rx="2" ry="3.5" fill="#212121" transform="rotate(25 -32 -22)"/>
  </g>

  <!-- Sliced Watermelon (Right Half) -->
  <g transform="translate(255, 145) rotate(26)">
    <path d="M0 0 A 55 55 0 0 1 55 40 L 0 0 Z" fill="#2E7D32"/>
    <path d="M4 3 A 48 48 0 0 1 50 36 L 4 3 Z" fill="#FFFFFF"/>
    <path d="M6 6 A 44 44 0 0 1 46 32 L 6 6 Z" fill="#FF1744"/>
    <!-- Seeds -->
    <ellipse cx="20" cy="14" rx="2" ry="3.5" fill="#212121" transform="rotate(30 20 14)"/>
    <ellipse cx="32" cy="22" rx="2" ry="3.5" fill="#212121" transform="rotate(25 32 22)"/>
  </g>

  <!-- Flying Orange Slice -->
  <g transform="translate(90, 70)">
    <circle cx="0" cy="0" r="28" fill="#FF9100"/>
    <circle cx="0" cy="0" r="24" fill="#FFE082"/>
    <circle cx="0" cy="0" r="21" fill="#FF6D00"/>
    <path d="M0 0 L 14 14 M0 0 L -14 14 M0 0 L 14 -14 M0 0 L -14 -14 M0 0 L 0 20 M0 0 L 0 -20 M0 0 L 20 0 M0 0 L -20 0" stroke="#FFE082" stroke-width="2"/>
  </g>

  <!-- Flying Strawberry -->
  <g transform="translate(320, 175) rotate(-15)">
    <path d="M0 -15 C 16 -15 22 10 0 25 C -22 10 -16 -15 0 -15 Z" fill="#E91E63"/>
    <path d="M-6 -15 C -2 -22 0 -22 0 -15 C 0 -22 2 -22 6 -15" stroke="#4CAF50" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-5" cy="-2" r="1.5" fill="#FFEB3B"/>
    <circle cx="4" cy="0" r="1.5" fill="#FFEB3B"/>
    <circle cx="0" cy="10" r="1.5" fill="#FFEB3B"/>
  </g>

  <!-- Juice Splatters -->
  <circle cx="180" cy="85" r="5" fill="#FF1744" opacity="0.9"/>
  <circle cx="165" cy="70" r="3" fill="#FF1744" opacity="0.8"/>
  <circle cx="215" cy="145" r="4.5" fill="#FF5252" opacity="0.9"/>
  <circle cx="240" cy="170" r="3" fill="#FF5252" opacity="0.8"/>
  <circle cx="110" cy="110" r="4" fill="#FF9100" opacity="0.8"/>

  <!-- Blade Slash Trail -->
  <path d="M 50 200 Q 190 130 350 50" stroke="url(#slash-grad)" stroke-width="6" stroke-linecap="round" filter="url(#neon-glow)"/>
  <path d="M 50 200 Q 190 130 350 50" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Sparks -->
  <polygon points="200,120 203,124 207,121 204,127 208,130 202,129 200,135 198,129 192,130 196,127 193,121 197,124" fill="#00F5D4" filter="url(#neon-glow)"/>
</svg>

