<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="mm-bg" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1128"/>
      <stop offset="1" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="card-front" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3A0CA3"/>
      <stop offset="1" stop-color="#4361EE"/>
    </linearGradient>
    <linearGradient id="card-match" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00F5D4"/>
      <stop offset="1" stop-color="#00BBF9"/>
    </linearGradient>
    <filter id="card-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" rx="16" fill="url(#mm-bg)"/>

  <!-- Left Card (Flipped: Star) -->
  <g transform="translate(100, 45)">
    <rect width="85" height="120" rx="12" fill="url(#card-front)" stroke="#7209B7" stroke-width="2"/>
    <!-- Yellow Star -->
    <path d="M42.5 35 L47 50 L63 50 L50 60 L55 75 L42.5 65 L30 75 L35 60 L22 50 L38 50 Z" fill="#FEE440" filter="url(#card-glow)"/>
    <!-- Glow ring -->
    <circle cx="42.5" cy="55" r="30" stroke="#FEE440" stroke-dasharray="3 4" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Right Card (Flipped: Matching Star!) -->
  <g transform="translate(215, 45)">
    <rect width="85" height="120" rx="12" fill="url(#card-match)" stroke="#FFFFFF" stroke-width="2" filter="url(#card-glow)"/>
    <!-- Yellow Star -->
    <path d="M42.5 35 L47 50 L63 50 L50 60 L55 75 L42.5 65 L30 75 L35 60 L22 50 L38 50 Z" fill="#FFFFFF"/>
    <!-- Confetti / Match sparkles -->
    <circle cx="15" cy="20" r="3" fill="#FEE440"/>
    <circle cx="70" cy="25" r="2.5" fill="#FF007A"/>
    <circle cx="20" cy="100" r="2" fill="#7209B7"/>
    <circle cx="72" cy="95" r="3.5" fill="#FEE440"/>
  </g>

  <!-- Background Floating Unflipped Card -->
  <g transform="translate(45, 75) rotate(-14)">
    <rect width="65" height="90" rx="8" fill="#1B1F3B" stroke="#480CA8" stroke-width="1.5"/>
    <rect x="10" y="10" width="45" height="70" rx="4" fill="none" stroke="#480CA8" stroke-dasharray="4 4"/>
    <circle cx="32.5" cy="45" r="10" fill="#4361EE" opacity="0.5"/>
  </g>

  <!-- Background Floating Unflipped Card Right -->
  <g transform="translate(305, 80) rotate(16)">
    <rect width="65" height="90" rx="8" fill="#1B1F3B" stroke="#480CA8" stroke-width="1.5"/>
    <rect x="10" y="10" width="45" height="70" rx="4" fill="none" stroke="#480CA8" stroke-dasharray="4 4"/>
    <circle cx="32.5" cy="45" r="10" fill="#4361EE" opacity="0.5"/>
  </g>

  <!-- Success connection line -->
  <path d="M185 105 Q 200 95 215 105" stroke="#00F5D4" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 4"/>
</svg>

